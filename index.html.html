<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Series</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

header{
  padding:20px;
  font-size:22px;
  background:#020617;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

@media(min-width:768px){
  .grid{grid-template-columns:repeat(4,1fr);}
}

.card{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
}

.btn{
  background:#38bdf8;
  padding:6px;
  margin-top:5px;
  cursor:pointer;
  border-radius:8px;
}
</style>
</head>

<body>

<header>🎬 Series Landing Page</header>

<div class="grid">

<div class="card">Squid Game<div class="btn" onclick="_KB()">Watch</div></div>
<div class="card">Goblin<div class="btn" onclick="_KB()">Watch</div></div>
<div class="card">Vincenzo<div class="btn" onclick="_KB()">Watch</div></div>
<div class="card">Ertugrul<div class="btn" onclick="_KB()">Watch</div></div>

</div>

<script>
function _KB(){
  alert("Your script here");
}
</script>

</body>
</html>
