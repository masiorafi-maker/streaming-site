<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stream Korean & Turkish Series</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#141414;
  color:#fff;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:15px;
  background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  z-index:100;
}

header h1{
  color:red;
  font-size:20px;
}

/* HERO */
.hero{
  height:70vh;
  background:url('https://via.placeholder.com/1200x600') center/cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:20px;
}

.hero h2{
  font-size:28px;
}

.hero p{
  max-width:400px;
  font-size:14px;
}

.hero button{
  background:red;
  border:none;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
}

/* ROW */
.row{
  margin-top:20px;
  padding:10px;
}

.row h3{
  margin-bottom:10px;
}

/* SCROLL */
.scroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
}

.scroll::-webkit-scrollbar{
  display:none;
}

/* CARD */
.card{
  min-width:140px;
  height:140px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.1);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#000;
  padding:20px;
  border-radius:10px;
}

.close{
  cursor:pointer;
  float:right;
}
</style>
</head>

<body>

<header>
  <h1>StreamHub</h1>
</header>

<!-- HERO -->
<div class="hero">
  <h2>🔥 Trending Now</h2>
  <p>Watch the best Korean and Turkish series in HD جودة عالية</p>
  <button onclick="_KB()">▶ Play Now</button>
</div>

<!-- ROWS -->
<div class="row">
  <h3>Korean Dramas</h3>
  <div class="scroll" id="korean"></div>
</div>

<div class="row">
  <h3>Turkish Series</h3>
  <div class="scroll" id="turkish"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">X</span>
    <h3 id="title"></h3>
    <button onclick="_KB()">Watch</button>
  </div>
</div>

<script>
const korean = [
"Squid Game","Goblin","Vincenzo","The Glory","Start-Up",
"True Beauty","My Name","Healer"
];

const turkish = [
"Ertugrul","Kurulus Osman","Hercai","Black Love",
"Fatmagul","Dolunay","Yargi","Sefirin Kizi"
];

function render(list, id){
  const container = document.getElementById(id);

  list.forEach(name=>{
    container.innerHTML += `
      <div class="card" onclick="openModal('${name}')">
        <img src="https://via.placeholder.com/300?text=${name}">
      </div>
    `;
  });
}

function openModal(name){
  document.getElementById("modal").style.display="flex";
  document.getElementById("title").innerText=name;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function _KB(){
  alert("Your monetization script here");
}

render(korean,"korean");
render(turkish,"turkish");
</script>

</body>
</html>
